plugins {
    id 'java'
}

def aatVersion = providers.gradleProperty('aatVersion').getOrElse('0.1.0-beta')

// The root project only aggregates artifacts; it has no sources of its own.
tasks.named('jar') {
    enabled = false
}

allprojects {
    group = 'kostin.ak'
    version = aatVersion

    repositories {
        mavenCentral()
        maven {
            name = "papermc"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
        maven {
            name = "oraxen"
            url = "https://repo.oraxen.com/releases"
        }
    }
}

subprojects {
    apply plugin: 'java'

    def targetJavaVersion = 21
    def paperVersion = providers.gradleProperty('paperVersion').getOrElse('1.21.4-R0.1-SNAPSHOT')
    // Paper 26.x publishes Java 25 class files, so the compiler toolchain must be 25.
    // The produced bytecode stays on Java 21 (options.release), which keeps the
    // artifact usable on 1.21.x servers.
    java {
        if (paperVersion.startsWith('1.')) {
            def javaVersion = JavaVersion.toVersion(targetJavaVersion)
            sourceCompatibility = javaVersion
            targetCompatibility = javaVersion
            if (JavaVersion.current() < javaVersion) {
                toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
            }
        } else {
            toolchain.languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            options.release.set(targetJavaVersion)
        }
    }
}

// Aggregating tasks kept for compatibility with existing scripts.
tasks.register('apiJar') {
    dependsOn ':aat-api:jar'
    doLast {
        copy {
            from project(':aat-api').tasks.jar.archiveFile
            into layout.buildDirectory.dir('libs')
            rename { "ActionsAndTriggers-${aatVersion}-api.jar" }
        }
    }
}

tasks.register('shadowJar') {
    dependsOn ':aat-core:shadowJar'
}

// Opt-in deployment: pass -PdeployDir=<path> to copy the shaded jar into a server.
tasks.register('deployToPlugins') {
    dependsOn ':aat-core:shadowJar'
    onlyIf { project.hasProperty('deployDir') }
    doLast {
        copy {
            from layout.buildDirectory.file("libs/ActionsAndTriggers-${aatVersion}-all.jar")
            into project.property('deployDir')
            rename { "ActionsAndTriggers.jar" }
        }
    }
}

build {
    dependsOn ':aat-api:build'
    dependsOn ':aat-core:build'
    dependsOn 'apiJar'
    dependsOn 'shadowJar'
}
