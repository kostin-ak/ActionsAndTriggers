name: CI

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean build apiJar shadowJar \
            -PpaperVersion=1.21.4-R0.1-SNAPSHOT \
            -PaatVersion=0.0.0-ci \
            --no-daemon --console=plain

      - name: Verify artifacts
        run: |
          ls -l build/libs
          test -f build/libs/ActionsAndTriggers-0.0.0-ci-all.jar
          test -f build/libs/ActionsAndTriggers-0.0.0-ci-api.jar

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: aat-jars
          path: |
            build/libs/ActionsAndTriggers-0.0.0-ci-all.jar
            build/libs/ActionsAndTriggers-0.0.0-ci-api.jar
          if-no-files-found: error

  compile-matrix:
    name: Compile against Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper:
          - 1.21.4-R0.1-SNAPSHOT
          - 1.21.5-R0.1-SNAPSHOT
          - 1.21.8-R0.1-SNAPSHOT
          - 1.21.11-R0.1-SNAPSHOT
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew :aat-api:compileJava :aat-core:compileJava \
            -PpaperVersion=${{ matrix.paper }} \
            -PaatVersion=0.0.0-ci \
            --no-daemon --console=plain

  smoke:
    name: Smoke test on Paper ${{ matrix.mc }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.4'
            java: '21'
          - mc: '1.21.11'
            java: '21'
          - mc: '26.3'
            java: '25'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: aat-jars
          path: build/libs

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Download Paper ${{ matrix.mc }}
        run: |
          mkdir -p server
          url=$(curl -fsSL "https://fill.papermc.io/v3/projects/paper/versions/${{ matrix.mc }}/builds" \
            | jq -r '.[0].downloads."server:default".url')
          echo "Downloading $url"
          curl -fsSL "$url" -o server/paper.jar

      - name: Run smoke test
        run: bash scripts/smoke-test.sh server build/libs/ActionsAndTriggers-0.0.0-ci-all.jar