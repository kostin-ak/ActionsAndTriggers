plugins {
    id 'java'
    id 'jacoco'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    // Новое имя плагина Shadow, версия 8.3.5 поддерживает Java 21
    id("com.gradleup.shadow") version "8.3.5"
}

group = 'kostin.ak'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url = "https://jitpack.io" }
    maven {
        url "https://repo.oraxen.com/releases"
    }
}

dependencies {
    // Paper API
    compileOnly("io.papermc.paper:paper-api:1.21.5-R0.1-SNAPSHOT")
    testImplementation("io.papermc.paper:paper-api:1.21.5-R0.1-SNAPSHOT")

    // Revxrsal Commands (Lamp)
    implementation("com.github.Revxrsal.Lamp:common:3.2.1")
    implementation("com.github.Revxrsal.Lamp:bukkit:3.2.1")

    // Lombok (для Java 21 берем актуальную версию)
    compileOnly("org.projectlombok:lombok:1.18.36")
    annotationProcessor("org.projectlombok:lombok:1.18.36")

    compileOnly("io.th0rgal:oraxen:1.193.3")
    compileOnly("com.github.LoneDev6:api-itemsadder:3.6.1")

    // Testing & Benchmarking
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.mockito:mockito-core:5.11.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.11.0")
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }

    shadowJar {
        // Релоцируем Lamp, чтобы избежать конфликтов
        relocate 'revxrsal.commands', 'kostin.ak.actionstriggers.libs.revxrsal'
    }

    build {
        dependsOn shadowJar
    }

    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}