name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    tags:
      - 'nightly'

permissions:
  contents: write

jobs:
  build:
    name: Build nightly
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compute nightly version
        id: meta
        run: |
          VERSION="0.1.0-beta-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Nightly version: $VERSION"

      - name: Build plugin and API jars
        run: |
          chmod +x gradlew
          ./gradlew clean build apiJar shadowJar \
            -PpaperVersion=1.21.4-R0.1-SNAPSHOT \
            -PaatVersion="$VERSION" \
            --no-daemon --console=plain

      - name: Checksums
        run: |
          cd build/libs
          sha256sum *"${VERSION}"*.jar > checksums.sha256
          cat checksums.sha256

      - name: Upload nightly files
        uses: actions/upload-artifact@v4
        with:
          name: nightly-files
          path: |
            build/libs/*.jar
            build/libs/checksums.sha256
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ matrix.mc }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.4'
            java: '21'
          - mc: '26.3'
            java: '25'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download nightly files
        uses: actions/download-artifact@v4
        with:
          name: nightly-files

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Download Paper ${{ matrix.mc }}
        run: |
          mkdir -p server
          url=$(curl -fsSL "https://fill.papermc.io/v3/projects/paper/versions/${{ matrix.mc }}/builds" \
            | jq -r '.[0].downloads."server:default".url')
          echo "Downloading $url"
          curl -fsSL "$url" -o server/paper.jar

      - name: Run smoke test
        run: |
          JAR=$(find . -name 'ActionsAndTriggers-*-all.jar' | head -n 1)
          echo "Testing $JAR"
          bash scripts/smoke-test.sh server "$JAR"

  publish:
    name: Update nightly release
    runs-on: ubuntu-latest
    needs: [ build, smoke ]
    steps:
      - name: Download nightly files
        uses: actions/download-artifact@v4
        with:
          name: nightly-files

      - name: Move nightly tag
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/nightly" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "nightly now points at $GITHUB_SHA"

      - name: Remove previous nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null \
            | while read -r asset; do
                [ -n "$asset" ] && gh release delete-asset nightly "$asset" -y
              done || true

      - name: Publish nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build 🌙"
          prerelease: true
          body: |
            Automated development build from the latest `master` commit.

            **Version:** `${{ needs.build.outputs.version }}`
            **Commit:** `${{ github.sha }}`
            **Built:** ${{ github.event.head_commit.timestamp || github.run_started_at }}

            Compatibility matches `0.1.0-beta`: Paper/Purpur 1.21.4 – 26.3.
            This build is not a stable release; see `docs/en/POTENTIAL_ISSUES.md`.
          files: |
            ActionsAndTriggers-*-all.jar
            ActionsAndTriggers-*-api.jar
            checksums.sha256
          fail_on_unmatched_files: true
