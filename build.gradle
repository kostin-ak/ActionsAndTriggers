plugins {
    id 'java'
}

allprojects {
    group = 'kostin.ak'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
        maven {
            name = "papermc"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
        maven {
            name = "oraxen"
            url = "https://repo.oraxen.com/releases"
        }
    }
}

subprojects {
    apply plugin: 'java'

    def targetJavaVersion = 21
    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            options.release.set(targetJavaVersion)
        }
    }
}

// Корневые агрегирующие таски для совместимости со всеми скриптами и ссылками
tasks.register('apiJar') {
    dependsOn ':aat-api:jar'
    doLast {
        copy {
            from project(':aat-api').tasks.jar.archiveFile
            into "${project.projectDir}/build/libs"
            rename { "ActionsAndTriggers-1.0-SNAPSHOT-api.jar" }
        }
    }
}

tasks.register('shadowJar') {
    dependsOn ':aat-core:shadowJar'
}

tasks.register('deployToPlugins') {
    dependsOn ':aat-core:shadowJar'
    doLast {
        copy {
            from "${project.projectDir}/build/libs/ActionsAndTriggers-1.0-SNAPSHOT-all.jar"
            into "f:/Files/mc_test/plugins"
            rename { "ActionsAndTriggers.jar" }
        }
    }
}

build {
    dependsOn ':aat-api:build'
    dependsOn ':aat-core:build'
    dependsOn 'apiJar'
    dependsOn 'shadowJar'
    dependsOn 'deployToPlugins'
}