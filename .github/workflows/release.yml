name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Derive version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate release body
        run: python3 scripts/generate_release_body.py

      - name: Build plugin and API jars
        run: |
          chmod +x gradlew
          ./gradlew clean build apiJar shadowJar \
            -PpaperVersion=1.21.4-R0.1-SNAPSHOT \
            -PaatVersion="$VERSION" \
            --no-daemon --console=plain

      - name: Verify artifacts
        run: |
          ls -l build/libs
          test -f "build/libs/ActionsAndTriggers-${VERSION}-all.jar"
          test -f "build/libs/ActionsAndTriggers-${VERSION}-api.jar"

      - name: Checksums
        run: |
          cd build/libs
          sha256sum *"${VERSION}"*.jar > checksums.sha256
          cat checksums.sha256

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/libs/*.jar
            build/libs/checksums.sha256
            release_body.md
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ matrix.mc }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.4'
            java: '21'
          - mc: '1.21.11'
            java: '21'
          - mc: '26.3'
            java: '25'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Download Paper ${{ matrix.mc }}
        run: |
          mkdir -p server
          url=$(curl -fsSL "https://fill.papermc.io/v3/projects/paper/versions/${{ matrix.mc }}/builds" \
            | jq -r '.[0].downloads."server:default".url')
          echo "Downloading $url"
          curl -fsSL "$url" -o server/paper.jar

      - name: Run smoke test
        run: |
          JAR=$(ls ActionsAndTriggers-*-all.jar | head -n 1)
          echo "Testing $JAR"
          bash scripts/smoke-test.sh server "$JAR"

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [ build, smoke ]
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ActionsAndTriggers-*-all.jar
            ActionsAndTriggers-*-api.jar
            checksums.sha256
          fail_on_unmatched_files: true